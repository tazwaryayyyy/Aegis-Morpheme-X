name: Test AMX Protocol

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      SIMULATE_HCS: "true"
      HEDERA_NETWORK: "testnet"
      HEDERA_ACCOUNT_ID: "0.0.0000000"
      HEDERA_PRIVATE_KEY: "302e020100300506032b657004220420aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      HCS_TOPIC_ID: "0.0.0000001"
      HCS_SENTINEL_TOPIC_ID: "0.0.0000002"
      HTS_TOKEN_ID: "0.0.0000003"
      OPENWEATHER_API_KEY: ""
      WEATHER_CITY: "Dhaka"
      LOG_LEVEL: "WARNING"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          pytest backend/tests/ -v --timeout=30 --tb=short

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --forceExit
        env:
          CI: true
